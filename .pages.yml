media:
  - name: images
    label: Fotografías e imágenes
    input: assets/uploads
    output: /assets/uploads
    categories: [image]
    rename: safe
  - name: documents
    label: Documentos y resultados
    input: assets/uploads
    output: /assets/uploads
    categories: [document]
    rename: safe

content:
  - name: general
    label: Página principal
    type: file
    path: data/site.json
    format: json
    operations:
      delete: false
    fields:
      - { name: season, label: Temporada, type: string }
      - { name: heroTitle, label: Título principal, type: text }
      - { name: heroDescription, label: Texto de portada, type: text }
      - { name: introEyebrow, label: Encabezado institucional, type: string }
      - { name: introTitle, label: Título institucional, type: text }
      - { name: introText, label: Descripción institucional, type: text }
      - { name: instagram, label: Instagram, type: string }
      - { name: whatsapp, label: WhatsApp, type: string }
      - { name: email, label: Correo, type: string }
      - { name: resultsUrl, label: Enlace general de resultados, type: string }

  - name: races
    label: Carreras activas
    type: file
    path: data/races.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{title} · {date}"
    fields:
      - { name: theme, label: Tema visual, type: select, options: { values: [halloween, cascades, forest, treasure, default] } }
      - { name: badge, label: Etiqueta, type: string }
      - { name: title, label: Nombre de la carrera, type: string }
      - { name: place, label: Lugar, type: string }
      - { name: date, label: Fecha, type: string }
      - { name: distances, label: Distancias, type: string }
      - { name: description, label: Descripción, type: text }
      - name: image
        label: Fotografía principal
        type: image
        options: { media: images }
      - { name: registrationUrl, label: Enlace de inscripción, type: string }
      - { name: infoUrl, label: Enlace de información, type: string }
      - { name: active, label: Mostrar en la web, type: boolean }

  - name: championship
    label: Campeonato Provincial
    type: file
    path: data/championship.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{number} · {name}"
    fields:
      - { name: number, label: Número, type: string }
      - { name: name, label: Nombre, type: string }
      - { name: city, label: Ciudad, type: string }
      - { name: date, label: Fecha, type: string }
      - { name: status, label: Estado, type: string }

  - name: gallery
    label: Galería
    type: file
    path: data/gallery.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{title} · {city}"
    fields:
      - { name: title, label: Evento, type: string }
      - { name: city, label: Ciudad, type: string }
      - { name: year, label: Año, type: string }
      - name: image
        label: Foto de portada
        type: image
        options: { media: images }
      - { name: albumUrl, label: Enlace del álbum completo, type: string }

  - name: sponsors
    label: Auspiciantes
    type: file
    path: data/sponsors.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{name}"
    fields:
      - { name: name, label: Marca, type: string }
      - name: logo
        label: Logo
        type: image
        options: { media: images }
      - { name: url, label: Sitio o red social, type: string }
